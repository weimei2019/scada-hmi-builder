<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:32px 24px 64px}
  /* ---------- header ---------- */

  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:6px}
  h1{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:12px}

  .sub b{color:var(--text);font-weight:600}
  .stamp{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
  .stamp .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:6px;vertical-align:middle}
  /* ---------- kpi ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .label{font-size:12px;color:var(--muted);font-weight:500}
  .kpi .value{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .hint{font-size:11.5px;color:var(--text-2);margin-top:2px}
  /* ---------- panels ---------- */
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px}
  .panel h2{font-size:14px;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between}
  .panel h2 span.note{font-size:11.5px;color:var(--muted);font-weight:400}
  /* bars */
  .bars{margin-top:18px;display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:18px 148px 1fr 62px;align-items:center;gap:10px;font-size:12.5px}
  .bar-row .rk{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px;text-align:right}
  .bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
  .bar-track{height:9px;background:#f1f4f9;border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#3b82f6,#2563eb)}
  .bar-row .vl{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
  /* donut */
  .donut-wrap{display:flex;gap:18px;align-items:center;margin-top:14px}
  .donut-legend{flex:1;display:flex;flex-direction:column;gap:7px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
  .lg .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .lg .n{margin-left:auto;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .seg{display:inline-flex;background:#f1f4f9;border-radius:8px;padding:3px}
  .seg button{border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--text-2);padding:6px 13px;
    border-radius:6px;cursor:pointer;transition:.15s}
  .seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.10)}
  .filters{display:flex;gap:8px;align-items:center}
  select,input[type=search]{font:inherit;font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--border);
    border-radius:8px;padding:7px 11px;outline:none}
  input[type=search]{width:190px}
  select:focus,input:focus{border-color:#bfd0f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
  /* ---------- table ---------- */
  .tbl-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;
    text-align:left;padding:13px 14px;background:#fafbfd;border-bottom:1px solid var(--border);white-space:nowrap}
  thead th.r{text-align:right}
  tbody td{padding:15px 14px;border-bottom:1px solid var(--border-2);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfcfe}
  .rk-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;
    font-size:12px;font-weight:700;background:#f1f4f9;color:var(--text-2);font-variant-numeric:tabular-nums}
  .rk-badge.t1{background:#fff5e0;color:#b45309}
  .rk-badge.t2{background:#eef1f6;color:#475569}
  .rk-badge.t3{background:#fdf0e6;color:#9a5b1f}
  .repo{display:flex;gap:11px;align-items:flex-start;min-width:250px}
  .repo img{width:26px;height:26px;border-radius:6px;flex:none;background:#f1f4f9}
  .repo .nm{font-weight:600;font-size:13.5px;line-height:1.35}
  .repo .nm a{color:var(--text);text-decoration:none}
  .repo .nm a:hover{color:var(--accent);text-decoration:underline}
  .repo .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;

  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;background:#f4f6fa;color:var(--text-2);

  .lang{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .lang .sw{width:8px;height:8px;border-radius:50%;flex:none}

  .num small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
  .delta{font-size:11px;font-weight:600}
  .delta.up{color:#dc2626}

  .date{font-size:12px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}

  .exc th{color:var(--muted);font-weight:600;background:#fafbfd}
  footer{margin-top:30px;text-align:center;font-size:11.5px;color:var(--muted)}

const C = {
  blue:'#2563eb', violet:'#7c3aed', teal:'#0d9488', amber:'#d97706',
  rose:'#e11d48', slate:'#64748b', green:'#16a34a', pink:'#db2777'
};
const LANG_COLORS = {
  Python:C.blue, TypeScript:'#3178c6', JavaScript:'#eab308', Go:'#0891b2', Rust:'#b45309',
  'C++':'#d9578b', 'Jupyter Notebook':'#d97706', Shell:'#16a34a', Svelte:'#ef4444',
  MDX:'#64748b', None:C.slate, Java:'#b07219', C:'#555555', HTML:'#e34c26', Vue:'#41b883'
};
const PALETTE = [C.blue, C.violet, C.teal, C.amber, C.rose, C.green, C.pink, C.slate];

const fmt = n => n >= 10000 ? (n/10000).toFixed(1) + '万' : n.toLocaleString('en-US');
const fmtFull = n => n.toLocaleString('en-US');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortDate = s => s ? s.slice(0, 10) : '—';

const state = { sort:'stars', lang:'all', cat:'all', q:'' };
const repos = DATA.repos || [];

/* ---------------- KPIs ---------------- */
function renderKPIs(){
  const total = repos.reduce((a,r)=>a+r.stars,0);
  const avg = Math.round(total / (repos.length || 1));
  const langs = new Set(repos.map(r=>r.language||'其他'));
  const cats = new Set(repos.map(r=>r.category));
  const recent = repos.filter(r=>{
    const d = (Date.now() - new Date(r.pushed_at).getTime()) / 86400000;
    return d <= 7;
  }).length;
  const cards = [
    {label:'Top 20 总 Star', value:fmt(total), hint:'平均 ' + fmtFull(avg) + ' / 项目'},
    {label:'候选池规模', value:fmtFull(DATA.meta.pool_size||0), hint:'8 个 AI 主题检索去重'},
    {label:'覆盖语言', value:langs.size, hint:'Top 20 项目所用语言数'},
    {label:'分类维度', value:cats.size, hint:'Agent / 框架 / 生成式…'},
    {label:'近 7 天有推送', value:recent + ' 个', hint:'活跃度：占比 ' + Math.round(recent/(repos.length||1)*100) + '%'}
  ];
  document.getElementById('kpis').innerHTML = cards.map(c=>`
    <div class="kpi"><div class="label">${esc(c.label)}</div>
      <div class="value">${esc(c.value)}</div><div class="hint">${esc(c.hint)}</div></div>`).join('');
}

/* ---------------- bars ---------------- */
function renderBars(){
  const max = Math.max(...repos.map(r=>r.stars), 1);
  document.getElementById('bars').innerHTML = repos.map((r,i)=>{
    const w = Math.max(2, r.stars / max * 100);
    return `<div class="bar-row">
      <div class="rk">${i+1}</div>
      <div class="nm" title="${esc(r.full_name)}">${esc(r.full_name.split('/')[1])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
      <div class="vl">${fmt(r.stars)}</div>
    </div>`;
  }).join('');
}

/* ---------------- donut ---------------- */
function renderDonut(){
  const agg = {};
  repos.forEach(r=>{ const k = r.language || '其他'; agg[k] = (agg[k]||0) + r.stars; });
  const entries = Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((a,e)=>a+e[1],0) || 1;
  const R = 54, SW = 15, CIRC = 2*Math.PI*R;
  let off = 0;
  const arcs = entries.map((e,i)=>{
    const frac = e[1]/total, len = frac*CIRC;
    const seg = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${LANG_COLORS[e[0]]||PALETTE[i%PALETTE.length]}"
      stroke-width="${SW}" stroke-dasharray="${len} ${CIRC-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 70 70)" stroke-linecap="butt"></circle>`;
    off += len; return seg;
  }).join('');
  document.getElementById('donut').innerHTML = `
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="#f1f4f9" stroke-width="${SW}"></circle>
      ${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">${entries.length}</text>
      <text x="70" y="84" text-anchor="middle" font-size="10.5" fill="#8a95a5">种语言</text>
    </svg>`;
  document.getElementById('legend').innerHTML = entries.slice(0,7).map((e,i)=>`
    <div class="lg"><span class="sw" style="background:${LANG_COLORS[e[0]]||PALETTE[i%PALETTE.length]}"></span>
      ${esc(e[0])}<span class="n">${Math.round(e[1]/total*100)}%</span></div>`).join('');
}

/* ---------------- table ---------------- */
function rows(){
  return repos.filter(r=>{
    if (state.lang !== 'all' && (r.language||'其他') !== state.lang) return false;
    if (state.cat !== 'all' && r.category !== state.cat) return false;
    if (state.q){
      const q = state.q.toLowerCase();
      if (!(r.full_name + ' ' + (r.description||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>{
    if (state.sort === 'forks') return b.forks - a.forks;
    if (state.sort === 'pushed') return new Date(b.pushed_at) - new Date(a.pushed_at);
    return b.stars - a.stars;
  });
}

function renderTable(){
  const list = rows();
  const tbody = document.getElementById('tbody');
  if (!list.length){ tbody.innerHTML = '<tr><td colspan="7" class="empty">没有匹配的项目</td></tr>'; return; }
  tbody.innerHTML = list.map(r=>{
    const rankCls = r.rank === 1 ? 't1' : r.rank === 2 ? 't2' : r.rank === 3 ? 't3' : '';
    const d = r.delta;
    const deltaHtml = (d === null || d === undefined)
      ? '<small>—</small>'
      : `<span class="delta ${d > 0 ? 'up' : 'flat'}">${d > 0 ? '+' : ''}${fmtFull(d)}</span>`;
    const lang = r.language || '其他';
    return `<tr>
      <td><span class="rk-badge ${rankCls}">${r.rank}</span></td>
      <td>
        <div class="repo">
          <img src="${esc(r.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">
          <div>
            <div class="nm"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full_name)}</a></div>
            <div class="desc">${esc(r.description || '（暂无描述）')}</div>
          </div>
        </div>
      </td>
      <td class="hide-sm"><span class="tag">${esc(r.category)}</span></td>
      <td class="hide-sm"><span class="lang"><span class="sw" style="background:${LANG_COLORS[lang]||C.slate}"></span>${esc(lang)}</span></td>
      <td class="num">${fmtFull(r.stars)}${deltaHtml}</td>
      <td class="num hide-sm">${fmtFull(r.forks)}</td>
      <td class="date hide-sm">${shortDate(r.pushed_at)}</td>
    </tr>`;
  }).join('');
}

/* ---------------- init ---------------- */
function init(){
  document.getElementById('stamp-time').innerHTML = esc(DATA.meta.generated_at_display || '—');
  document.getElementById('pool').textContent = fmtFull(DATA.meta.pool_size||0);
  document.getElementById('foot').innerHTML =
    '由自动化流程每日生成 · 数据源 GitHub REST Search API · 生成时间 ' + esc(DATA.meta.generated_at||'') +
    ' · 仓库 ' + esc(DATA.meta.repo||'');

  renderKPIs(); renderBars(); renderDonut(); renderTable();

  const langs = [...new Set(repos.map(r=>r.language||'其他'))].sort();
  document.getElementById('lang-sel').innerHTML = '<option value="all">全部语言</option>' +
    langs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
  const cats = [...new Set(repos.map(r=>r.category))];
  document.getElementById('cat-sel').innerHTML = '<option value="all">全部分类</option>' +
    cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');

  document.getElementById('seg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    [...document.querySelectorAll('#seg button')].forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state.sort = b.dataset.sort; renderTable();
  });
  document.getElementById('lang-sel').addEventListener('change', e=>{ state.lang = e.target.value; renderTable(); });
  document.getElementById('cat-sel').addEventListener('change', e=>{ state.cat = e.target.value; renderTable(); });
  document.getElementById('q').addEventListener('input', e=>{ state.q = e.target.value.trim(); renderTable(); });

  document.getElementById('rules').innerHTML = `
    <ul>
      <li><b>检索范围：</b>对 8 个 AI 相关 topic 做 Star 降序检索（<code>topic:ai</code>、<code>topic:llm</code>、<code>topic:machine-learning</code>、<code>topic:deep-learning</code>、<code>topic:artificial-intelligence</code>、<code>topic:generative-ai</code>、<code>topic:ai-agents</code>、<code>topic:chatgpt</code>），每类取前 100，按 <code>full_name</code> 去重。</li>
      <li><b>纳入标准：</b>可运行的 AI 软件项目 —— 框架、推理引擎、Agent 工具链、应用平台、生成式内容工具。</li>
      <li><b>排除标准：</b>Awesome 清单、Prompt / 系统提示词合集、课程与教材、面试指南，以及与 AI 无实质关联的通用基础设施。</li>
      <li><b>排序：</b>按 <code>stargazers_count</code> 降序取前 20；同分时按 Fork 数次序。</li>
      <li><b>Star 增量：</b>与上一份快照对比，首次运行无历史数据时显示 “—”。</li>
    </ul>`;
  document.getElementById('exc-body').innerHTML = (DATA.excluded||[]).map(x=>
    `<tr><td><a href="https://github.com/${esc(x.full_name)}" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none">${esc(x.full_name)}</a></td>
      <td style="font-variant-numeric:tabular-nums">${fmtFull(x.stars)}</td><td>${esc(x.reason)}</td></tr>`).join('');
}
init();
</script>
</body>
